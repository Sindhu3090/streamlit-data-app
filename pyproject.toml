[project]
name = "streamlit-data-app"
version = "0.1.0"
description = "A Streamlit data application built with a reproducible project setup."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.1",
    "pytest>=9.1.1",
]
